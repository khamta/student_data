<style>
  :root {
    --primary: #7a1f2b;
    --primary-dark: #5c1620;
    --bg: #f4f2ef;
    --border: #d8d2c9;
    --text: #2a2320;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Lao', 'Phetsarath OT', 'Saysettha OT', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  .topbar {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .tabs {
    display: flex;
    gap: 4px;
    background: #fff;
    padding: 8px 16px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 8px 8px 0 0;
    color: #555;
  }
  .tab-btn.active {
    background: var(--bg);
    color: var(--primary);
    font-weight: 700;
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--bg);
    margin-bottom: -1px;
  }
  .page { padding: 18px 20px; max-width: 1300px; margin: 0 auto; }
  .hidden { display: none !important; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  input, select, textarea {
    font-family: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    background: var(--primary);
    color: #fff;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: #6c6c6c; }
  button.danger { background: #b23b3b; }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }

  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    font-size: 13px;
    text-align: center;
    vertical-align: middle;
  }
  th { background: #efe7e2; }
  td.name-cell { text-align: left; }
  .thumb {
    width: 46px; height: 58px;
    object-fit: cover;
    border: 1px solid var(--border);
    background: #eee;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  .field { margin-bottom: 10px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 12px; overflow: auto; z-index: 50;
  }
  .modal {
    background: #fff; border-radius: 10px; padding: 20px;
    max-width: 720px; width: 100%;
  }
  .modal h2 { margin-top: 0; font-size: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: #eee; font-size: 11px;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 100;
  }
  .toast.error { background: #b23b3b; }
  .empty-state { text-align: center; color: #888; padding: 30px; }

  /* ---- Printable report ---- */
  #reportRoot { background: #fff; padding: 20px; }
  .report-header { text-align: center; margin-bottom: 6px; line-height: 1.5; }
  .report-title { font-weight: 700; text-decoration: underline; margin: 14px 0 4px; text-align: center; }
  .report-subtitle { text-align: center; text-decoration: underline; margin-bottom: 10px; }
  .category-heading { font-weight: 700; text-decoration: underline; margin: 16px 0 6px; text-align: left; }
  .summary-table td, .summary-table th { text-align: left; }
  .summary-table td.num { text-align: center; width: 70px; }
  .sign-row { display: flex; justify-content: space-between; margin-top: 40px; padding: 0 40px; }

  @media print {
    .no-print { display: none !important; }
    .page { padding: 0; max-width: none; }
    body { background: #fff; }
    #reportRoot { padding: 0; }
    table { font-size: 11px; }
  }

  @media (max-width: 800px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
